server:
  port: 8080

spring:
  application:
    name: gateway-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  codec:
    max-in-memory-size: 100MB
  main:
    web-application-type: reactive
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: iam-auth
          uri: lb://iam-service
          predicates:
            - Path=/api/auth/**
        - id: iam-user
          uri: lb://iam-service
          predicates:
            - Path=/api/user/**
        - id: iam-admin
          uri: lb://iam-service
          predicates:
            - Path=/api/admin/**
        - id: knowledge-graph-service
          uri: lb://knowledge-graph-service
          predicates:
            - Path=/api/graph/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/content/**
        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/traces/**
        - id: tracking-labs
          uri: lb://tracking-service
          predicates:
            - Path=/api/labs/**
        - id: tracking-dashboard
          uri: lb://tracking-service
          predicates:
            - Path=/api/tracking/**
        - id: adaptive-engine-service
          uri: lb://adaptive-engine-service
          predicates:
            - Path=/api/adaptive/**
        - id: tutoring-service
          uri: lb://tutoring-service
          predicates:
            - Path=/api/tutoring/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:change_me_jwt_secret_at_least_32_chars}
