server:
  port: 8086

spring:
  application:
    name: tutoring-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:change_me_rabbitmq_password}
    connection-timeout: 2s

app:
  events:
    exchange: adaptive.events
    lab-submitted-queue: tutoring.lab-submitted
    quiz-completed-queue: tutoring.quiz-completed

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.amqp.rabbit.connection.CachingConnectionFactory: warn
    org.springframework.amqp.rabbit.listener.SimpleMessageListenerContainer: off
